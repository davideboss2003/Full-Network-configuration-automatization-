! ============================================================================
! SN1-RTR -- LAN side, zone Subnet 1
!
! GENERATED FILE -- do not edit.
! Source: automation/inventory.yml -> render with automation/render.py
!
! Covers inter-VLAN routing and DHCP only. Transit-link addressing (stage A1)
! is configured separately and is not touched by this file.
! ============================================================================
enable
configure terminal
!
! --- Trunk to the access layer ----------------------------------------------
interface fastEthernet 0/0
 description Trunk to SN1-SW1
 no ip address
 no shutdown
exit
!
! --- Inter-VLAN routing (802.1Q sub-interfaces) -----------------------------
interface fastEthernet 0/0.10
 description Users VLAN 10 -- Subnet 1
 encapsulation dot1Q 10
 ip address 172.16.10.1 255.255.255.0
exit
!
interface fastEthernet 0/0.110
 description Management VLAN 110 -- Subnet 1
 encapsulation dot1Q 110
 ip address 172.16.110.1 255.255.255.0
exit
!
! --- DHCP -------------------------------------------------------------------
ip dhcp excluded-address 172.16.10.1 172.16.10.9
!
ip dhcp pool SN1-USERS
 network 172.16.10.0 255.255.255.0
 default-router 172.16.10.1
 dns-server 210.1.1.68
exit
!
end
!
copy running-config startup-config
