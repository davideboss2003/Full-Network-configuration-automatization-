! ============================================================================
! SN1-RTR -- LAN side, zone Subnet 1
!
! GENERATED FILE -- do not edit.
! Source: automation/inventory.yml -> render with automation/render.py
!
! Covers inter-VLAN routing and DHCP only. Transit-link addressing (stage A1)
! is configured separately and is not touched by this file.
! ============================================================================
enable
configure terminal
!
! --- Trunk to the access layer ----------------------------------------------
interface fastEthernet 0/0
 description Trunk to SN1-SW1
 no ip address
 no shutdown
exit
!
! --- Inter-VLAN routing (802.1Q sub-interfaces) -----------------------------
interface fastEthernet 0/0.10
 description Users VLAN 10 -- Subnet 1
 encapsulation dot1Q 10
 ip address 172.16.10.1 255.255.255.0
exit
!
interface fastEthernet 0/0.110
 description Management VLAN 110 -- Subnet 1
 encapsulation dot1Q 110
 ip address 172.16.110.1 255.255.255.0
exit
!
! --- DHCP -------------------------------------------------------------------
ip dhcp excluded-address 172.16.10.1 172.16.10.9
!
ip dhcp pool SN1-USERS
 network 172.16.10.0 255.255.255.0
 default-router 172.16.10.1
 dns-server 210.1.1.68
exit
!
!
! ── Security ────────────────────────────────────────────────────────────────
!
! Passwords stored as hashes, and the remaining plaintext in the configuration
! obscured. `enable secret` uses a one-way hash; `service password-encryption`
! only obscures, and is not a substitute for it.
!
service password-encryption
!
enable secret <set-in-secrets.yml>
!
! Two privilege levels. The operator account can inspect the device but not
! change it; the administrative account has full rights.
!
username operator privilege 5 secret <set-in-secrets.yml>
username admin privilege 15 secret <set-in-secrets.yml>
!
privilege exec level 5 show
privilege exec level 5 show running-config
privilege exec level 5 ping
!
! SSH requires a hostname, a domain name and an RSA key pair, in that order.
!
ip domain-name davide.ro
crypto key generate rsa
1024
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
! Remote access over SSH only. Telnet carries credentials in clear text.
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 5 0
exit
!
line console 0
 login local
 exec-timeout 5 0
 logging synchronous
exit
!
banner motd #
Authorised access only. Activity on this device is logged.
Disconnect immediately if you are not an authorised user.
#
!
end
!
copy running-config startup-config
