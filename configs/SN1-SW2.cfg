! ============================================================================
! SN1-SW2 -- access switch, zone Subnet 1
!
! GENERATED FILE -- do not edit.
! Source: automation/inventory.yml -> render with automation/render.py
! ============================================================================
enable
configure terminal
!
hostname SN1-SW2
!
! --- VLANs ------------------------------------------------------------------
vlan 10
 name Users-SN1
exit
!
vlan 110
 name Mgmt-SN1
exit
!
! --- Trunk links ------------------------------------------------------------
interface fastEthernet 0/3
 description Trunk to SN1-SW3
 switchport mode trunk
 switchport trunk allowed vlan 10,110
exit
!
interface fastEthernet 0/4
 description Trunk to SN1-SW1
 switchport mode trunk
 switchport trunk allowed vlan 10,110
exit
!
! --- Access ports -----------------------------------------------------------
!
! Port security limits how many MAC addresses a port accepts. It counters MAC
! flooding, where a table filled with fabricated addresses forces the switch to
! flood every frame to every port, and it stops an unauthorised device being
! plugged into a free socket.
!
! `restrict` drops the offending traffic and counts the violation while leaving
! the port up. `shutdown` would disable it until an administrator intervenes,
! which turns every relocated laptop into a support call.
!
interface range fastEthernet 0/1-2
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
exit
!
interface range fastEthernet 0/5-24
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
exit
!
! Uplink ports carry tagged traffic from every VLAN and are left without a
! MAC limit.
!
interface range gigabitEthernet 0/1-2
 switchport mode access
 switchport access vlan 10
exit
!
! --- Management interface ---------------------------------------------------
interface vlan 110
 description Management SVI
 ip address 172.16.110.3 255.255.255.0
 no shutdown
exit
!
ip default-gateway 172.16.110.1
!
! --- Spanning Tree ----------------------------------------------------------
spanning-tree vlan 10,110 root secondary
!
!
! ── Security ────────────────────────────────────────────────────────────────
!
! Passwords stored as hashes, and the remaining plaintext in the configuration
! obscured. `enable secret` uses a one-way hash; `service password-encryption`
! only obscures, and is not a substitute for it.
!
service password-encryption
!
enable secret <set-in-secrets.yml>
!
! Two privilege levels. The operator account can inspect the device but not
! change it; the administrative account has full rights.
!
username operator privilege 5 secret <set-in-secrets.yml>
username admin privilege 15 secret <set-in-secrets.yml>
!
privilege exec level 5 show
privilege exec level 5 show running-config
privilege exec level 5 ping
!
! SSH requires a hostname, a domain name and an RSA key pair, in that order.
!
ip domain-name davide.ro
crypto key generate rsa
1024
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
! Remote access over SSH only. Telnet carries credentials in clear text.
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 5 0
exit
!
line console 0
 login local
 exec-timeout 5 0
 logging synchronous
exit
!
banner motd #
Authorised access only. Activity on this device is logged.
Disconnect immediately if you are not an authorised user.
#
!
end
!
copy running-config startup-config
