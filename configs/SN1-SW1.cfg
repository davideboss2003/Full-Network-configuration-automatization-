! ============================================================================
! SN1-SW1 -- access switch, zone Subnet 1
!
! GENERATED FILE -- do not edit.
! Source: automation/inventory.yml -> render with automation/render.py
! ============================================================================
enable
configure terminal
!
hostname SN1-SW1
!
! --- VLANs ------------------------------------------------------------------
vlan 10
 name Users-SN1
exit
!
vlan 110
 name Mgmt-SN1
exit
!
! --- Trunk links ------------------------------------------------------------
interface fastEthernet 0/1
 description Trunk to SN1-SW2
 switchport mode trunk
 switchport trunk allowed vlan 10,110
exit
!
interface fastEthernet 0/2
 description Trunk to SN1-SW3
 switchport mode trunk
 switchport trunk allowed vlan 10,110
exit
!
interface fastEthernet 0/4
 description Trunk to SN1-RTR
 switchport mode trunk
 switchport trunk allowed vlan 10,110
exit
!
! --- Access ports -----------------------------------------------------------
interface fastEthernet 0/3
 switchport mode access
 switchport access vlan 10
exit
!
interface range fastEthernet 0/5-24
 switchport mode access
 switchport access vlan 10
exit
!
interface range gigabitEthernet 0/1-2
 switchport mode access
 switchport access vlan 10
exit
!
! --- Management interface ---------------------------------------------------
interface vlan 110
 description Management SVI
 ip address 172.16.110.2 255.255.255.0
 no shutdown
exit
!
ip default-gateway 172.16.110.1
!
! --- Spanning Tree ----------------------------------------------------------
spanning-tree vlan 10,110 root primary
!
end
!
copy running-config startup-config
