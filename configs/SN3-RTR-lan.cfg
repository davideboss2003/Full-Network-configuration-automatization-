! ============================================================================
! SN3-RTR -- LAN side, zone Subnet 3
!
! GENERATED FILE -- do not edit.
! Source: automation/inventory.yml -> render with automation/render.py
!
! Covers inter-VLAN routing and DHCP only. Transit-link addressing (stage A1)
! is configured separately and is not touched by this file.
! ============================================================================
enable
configure terminal
!
! --- Trunk to the access layer ----------------------------------------------
interface fastEthernet 0/0
 description Trunk to SN3-SW1
 no ip address
 no shutdown
exit
!
! --- Inter-VLAN routing (802.1Q sub-interfaces) -----------------------------
interface fastEthernet 0/0.30
 description Users VLAN 30 -- Subnet 3
 encapsulation dot1Q 30
 ip address 172.16.30.1 255.255.255.0
exit
!
interface fastEthernet 0/0.130
 description Management VLAN 130 -- Subnet 3
 encapsulation dot1Q 130
 ip address 172.16.130.1 255.255.255.0
exit
!
! --- DHCP -------------------------------------------------------------------
ip dhcp excluded-address 172.16.30.1 172.16.30.9
!
ip dhcp pool SN3-USERS
 network 172.16.30.0 255.255.255.0
 default-router 172.16.30.1
 dns-server 210.1.1.68
exit
!
end
!
copy running-config startup-config
