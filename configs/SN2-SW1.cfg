! ============================================================================
! SN2-SW1 -- access switch, zone Subnet 2
!
! GENERATED FILE -- do not edit.
! Source: automation/inventory.yml -> render with automation/render.py
! ============================================================================
enable
configure terminal
!
hostname SN2-SW1
!
! --- VLANs ------------------------------------------------------------------
vlan 20
 name Users-SN2
exit
!
vlan 120
 name Mgmt-SN2
exit
!
! --- Trunk links ------------------------------------------------------------
interface fastEthernet 0/1
 description Trunk to SN2-SW2
 switchport mode trunk
 switchport trunk allowed vlan 20,120
exit
!
interface fastEthernet 0/2
 description Trunk to SN2-SW3
 switchport mode trunk
 switchport trunk allowed vlan 20,120
exit
!
interface fastEthernet 0/3
 description Trunk to SN2-RTR
 switchport mode trunk
 switchport trunk allowed vlan 20,120
exit
!
! --- Access ports -----------------------------------------------------------
interface range fastEthernet 0/4-24
 switchport mode access
 switchport access vlan 20
exit
!
interface range gigabitEthernet 0/1-2
 switchport mode access
 switchport access vlan 20
exit
!
! --- Management interface ---------------------------------------------------
interface vlan 120
 description Management SVI
 ip address 172.16.120.2 255.255.255.0
 no shutdown
exit
!
ip default-gateway 172.16.120.1
!
! --- Spanning Tree ----------------------------------------------------------
spanning-tree vlan 20,120 root primary
!
end
!
copy running-config startup-config
