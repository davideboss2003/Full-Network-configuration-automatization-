! ============================================================================
! SN2-RTR -- LAN side, zone Subnet 2
!
! GENERATED FILE -- do not edit.
! Source: automation/inventory.yml -> render with automation/render.py
!
! Covers inter-VLAN routing and DHCP only. Transit-link addressing (stage A1)
! is configured separately and is not touched by this file.
! ============================================================================
enable
configure terminal
!
! --- Trunk to the access layer ----------------------------------------------
interface fastEthernet 0/0
 description Trunk to SN2-SW1
 no ip address
 no shutdown
exit
!
! --- Inter-VLAN routing (802.1Q sub-interfaces) -----------------------------
interface fastEthernet 0/0.20
 description Users VLAN 20 -- Subnet 2
 encapsulation dot1Q 20
 ip address 172.16.20.1 255.255.255.0
exit
!
interface fastEthernet 0/0.120
 description Management VLAN 120 -- Subnet 2
 encapsulation dot1Q 120
 ip address 172.16.120.1 255.255.255.0
exit
!
! --- DHCP -------------------------------------------------------------------
ip dhcp excluded-address 172.16.20.1 172.16.20.9
!
ip dhcp pool SN2-USERS
 network 172.16.20.0 255.255.255.0
 default-router 172.16.20.1
 dns-server 210.1.1.68
exit
!
end
!
copy running-config startup-config
