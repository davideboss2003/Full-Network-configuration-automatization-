! ============================================================================
! SN3-SW1 -- access switch, zone Subnet 3
!
! GENERATED FILE -- do not edit.
! Source: automation/inventory.yml -> render with automation/render.py
! ============================================================================
enable
configure terminal
!
hostname SN3-SW1
!
! --- VLANs ------------------------------------------------------------------
vlan 30
 name Users-SN3
exit
!
vlan 130
 name Mgmt-SN3
exit
!
! --- Trunk links ------------------------------------------------------------
interface fastEthernet 0/1
 description Trunk to SN3-RTR
 switchport mode trunk
 switchport trunk allowed vlan 30,130
exit
!
interface fastEthernet 0/3
 description Trunk to SN3-SW3
 switchport mode trunk
 switchport trunk allowed vlan 30,130
exit
!
interface fastEthernet 0/4
 description Trunk to SN3-SW2
 switchport mode trunk
 switchport trunk allowed vlan 30,130
exit
!
! --- Access ports -----------------------------------------------------------
interface fastEthernet 0/2
 switchport mode access
 switchport access vlan 30
exit
!
interface range fastEthernet 0/5-24
 switchport mode access
 switchport access vlan 30
exit
!
interface range gigabitEthernet 0/1-2
 switchport mode access
 switchport access vlan 30
exit
!
! --- Management interface ---------------------------------------------------
interface vlan 130
 description Management SVI
 ip address 172.16.130.2 255.255.255.0
 no shutdown
exit
!
ip default-gateway 172.16.130.1
!
! --- Spanning Tree ----------------------------------------------------------
spanning-tree vlan 30,130 root primary
!
end
!
copy running-config startup-config
